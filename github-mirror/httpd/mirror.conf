# Smart Git HTTP export for the ATS CI GitHub mirrors.
#
# This is included by the dedicated github-mirror-smart-http container. ATS
# terminates public HTTPS and remaps /mirror/ traffic to this container on
# 127.0.0.1:9417.

<IfModule !cgid_module>
    LoadModule cgid_module modules/mod_cgid.so
</IfModule>

SetEnv GIT_PROJECT_ROOT /usr/local/apache2/mirror
SetEnv GIT_HTTP_EXPORT_ALL 1

# During CI fanout, git-upload-pack can spend more than httpd's default
# 60 seconds generating a large pack before it writes the first response bytes.
Timeout 600
CGIDScriptTimeout 600

# Each request slot can run one git-http-backend/git-upload-pack (~100 MiB
# each during a clone). Cap concurrency so a CI fanout queues in the listen
# backlog instead of forking 40+ packers at once. The event MPM defaults allow
# 400 workers. These directives override the defaults because this file is
# included at the end of httpd.conf.
<IfModule mpm_event_module>
    StartServers             1
    ServerLimit              2
    ThreadsPerChild          8
    MaxRequestWorkers       16
    MinSpareThreads          8
    MaxSpareThreads         16
    ListenBacklog          511
</IfModule>

CustomLog "logs/access_log" combined

ScriptAlias /mirror/ /usr/lib/git-core/git-http-backend/

<Directory "/usr/lib/git-core">
    Options +ExecCGI
    AllowOverride None
    Require all granted
</Directory>

<LocationMatch "^/mirror/.*/git-receive-pack$">
    Require all denied
</LocationMatch>
